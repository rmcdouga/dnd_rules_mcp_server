spring.application.name=dnd_rules_mcp_server

# D&D Beyond API settings
dndbeyond.base-url=https://www.dndbeyond.com
dndbeyond.session-cookie-path=${user.home}/.dndbeyond-mcp/config.json
dndbeyond.request-timeout-seconds=30
dndbeyond.max-retries=3
dndbeyond.cache-ttl-seconds=86400

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always